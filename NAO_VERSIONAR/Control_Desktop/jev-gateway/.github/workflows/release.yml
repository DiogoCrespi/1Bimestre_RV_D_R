# Releases are driven by release-please, and everything happens in this one file.
#
# Every push to main runs the `release-please` job. It reads the conventional commits that landed
# since the last release and keeps a "release X.Y.Z" pull request open with the version bump and
# the changelog. Merging that pull request is the release: the same job then creates the tag and
# the GitHub release, and `publish` sends that tag to npm, then Homebrew.
#
# npm is published through trusted publishing (OIDC). There is no npm token anywhere: npm checks
# that the request comes from this repository and from a workflow file named release.yml, and
# GitHub proves it with a short-lived identity token. That is why release-please and the publish
# step both live in this file: a tag created with GITHUB_TOKEN starts no other workflow, and a
# publish step called from another workflow file would not match what npm trusts.
# One-time setup on npmjs.com and the release steps are in docs/releasing.md.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release again, e.g. v0.3.0"
        required: true
      dry_run:
        description: "Run every check and `npm publish --dry-run`, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release commit on the pull request branch, the tag, the GitHub release
      pull-requests: write # the release pull request
      issues: write # the autorelease labels
    # Two runs must not groom the same pull request at once. A run that is displaced while it
    # waits loses nothing: the next one finds the merged release pull request and tags it.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Configured by release-please-config.json and .release-please-manifest.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    needs: release-please
    # On a push, only when release-please has just cut a release. By hand, always: release-please
    # is skipped then, and a skipped dependency would otherwise skip this job too.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token npm trusts
      contents: write # to create the GitHub release when it does not exist yet
    concurrency:
      group: release-publish
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag }}
          fetch-depth: 0

      - name: Check the tag against package.json and main
        id: version
        run: |
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not vX.Y.Z."; exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PACKAGE_VERSION."; exit 1
          fi
          # A tag on some other branch must never reach npm.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG is not on main."; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # ships npm 11, which trusted publishing needs (11.5.1 or later)
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "jev-gateway@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::jev-gateway@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          # Checks and build ran above, so package scripts stay out of the step that holds the
          # publishing identity.
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --ignore-scripts --dry-run
          else
            npm publish --access public --ignore-scripts
          fi

      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # release-please has normally created it already. This covers a tag made by hand.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists."
            exit 0
          fi
          # The changelog section of this version, without its heading: "## 0.3.1" as written by
          # hand, or "## [0.3.2](compare link) (date)" as release-please writes it.
          awk -v version="$VERSION" '
            $0 ~ "^## " { printing = ($2 == version || index($2, "[" version "]") == 1); next }
            printing { print }
          ' CHANGELOG.md > notes.md
          printf '\nInstall or upgrade: `npm install -g jev-gateway`\n' >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag

  homebrew:
    needs: publish
    # Spelled out because release-please, further up the chain, is skipped on a run by hand.
    if: ${{ !cancelled() && needs.publish.result == 'success' && !inputs.dry_run }}
    uses: ./.github/workflows/release-homebrew.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
